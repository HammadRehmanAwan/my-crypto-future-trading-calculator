name: CI

# Runs on every push and pull request. A red CI means don't merge.
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (tsc --checkJs on frontend/js)
        run: npm run typecheck
      - name: Unit tests (calculator math, indicators, forecast)
        run: npm test
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test every page (third-party traffic stubbed)
        run: npm run smoke

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # for the Holt JS/Python parity test
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            scripts/requirements.txt
      - run: pip install -r requirements-backend.txt -r scripts/requirements.txt pytest
      - name: Backend, billing, alerts, lifecycle, backtest and site tests
        run: python -m pytest tests -q
      - name: Generated pages are up to date
        run: python scripts/build_site.py --check
