name: Weekly forecast backtest

# Replays the last 365 days for all 15 coins, writes
# frontend/data/accuracy.json (the public accuracy page) and redeploys Pages.
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run walk-forward backtest
        env:
          CG_DEMO_API_KEY: ${{ secrets.CG_DEMO_API_KEY }}
          # Scores Chronos-Bolt too when the HF Space model server is up.
          CHRONOS_URL: https://hammadrehman-crypto-futures-calculator.hf.space
        run: python scripts/backtest.py

      - name: Commit results
        id: commit
        run: |
          git config user.name "futurex-bot"
          git config user.email "actions@github.com"
          git add frontend/data/accuracy.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update forecast accuracy report ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the Pages deploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
