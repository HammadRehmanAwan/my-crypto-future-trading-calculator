services:
  - type: web
    name: futurex-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: CG_DEMO_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # ── Accounts & billing (see SETUP.md) ──
      - key: PAYWALL_ENABLED
        value: "false"
      - key: SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LS_VARIANT_PRO_MONTHLY
        sync: false
      - key: LS_VARIANT_PRO_YEARLY
        sync: false
      - key: LS_VARIANT_TRADER_MONTHLY
        sync: false
      - key: LS_VARIANT_TRADER_YEARLY
        sync: false
      - key: LS_ALLOW_TEST_MODE
        sync: false
      - key: EMAIL_LINK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
